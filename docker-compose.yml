version: "3.8"


services:
  app:
    build: .
    container_name: livros-API
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    command: [ "poetry","run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port","8000" ]

  redis:
    image: redis:8-alpine
    container_name: redis-server
    ports:
      - "6379:6379"